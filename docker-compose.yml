
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: awaazsetu-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awaazsetu-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
